[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raja-capture"
version = "0.1.0"
description = "Raja Capture - aplikasi screen capture, anotasi, dan perekam layar lintas platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "jeepney>=0.8; sys_platform == 'linux'",
]

[project.optional-dependencies]
x11 = ["pynput>=1.7", "python-xlib>=0.33"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
raja-capture = "raja_capture.app:main"

[tool.setuptools.packages.find]
include = ["raja_capture*"]

[tool.setuptools.package-data]
raja_capture = ["assets/*"]
