[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raja-capture"
version = "0.2.0"
description = "Raja Capture - aplikasi screen capture, anotasi, dan perekam layar lintas platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Firman Santosa" }]
keywords = ["screenshot", "screen-capture", "screen-recorder", "annotation", "ocr", "wayland", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "jeepney>=0.8; sys_platform == 'linux'",
]

[project.optional-dependencies]
x11 = ["pynput>=1.7", "python-xlib>=0.33"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.urls]
Homepage = "https://firexsantos.github.io/raja-capture/"
Source = "https://github.com/firexsantos/raja-capture"
Issues = "https://github.com/firexsantos/raja-capture/issues"

[project.gui-scripts]
raja-capture = "raja_capture.app:main"

[tool.setuptools.packages.find]
include = ["raja_capture*"]

[tool.setuptools.package-data]
raja_capture = ["assets/*"]
